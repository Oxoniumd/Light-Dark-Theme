<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Light/Dark Theme Toggle</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-black transition-all duration-300" id="pageBody">
    <div class="container mx-auto p-8 text-center">
      <h1 class="text-3xl font-bold mb-4">Light/Dark Theme Toggle</h1>

      <p class="mb-6">
        Click the button below to switch between light and dark modes.
      </p>

      <button
        onclick="toggleTheme()"
        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-800 transition"
      >
        Toggle Theme
      </button>
    </div>

    <script>
      function toggleTheme() {
        const body = document.getElementById("pageBody");
        body.classList.toggle("bg-white");
        body.classList.toggle("text-black");
        body.classList.toggle("bg-black");
        body.classList.toggle("text-white");
      }
    </script>
  </body>
</html>
